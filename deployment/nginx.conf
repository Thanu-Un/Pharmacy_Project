server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com; # Replace with your actual domain or server IP

    # The root directory where your React frontend (client/dist) is located
    root /var/www/html/pharmacy/client/dist;
    index index.html;

    # Serve the React Frontend
    location / {
        try_files $uri $uri/ /index.html; # Ensure React Router works correctly
    }

    # Proxy API Requests to Spring Cloud Gateway
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts in case Backend is slow
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Optional: Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
