server:
  port: 8080

spring:
  application:
    name: gateway-service
  codec:
    max-in-memory-size: 10MB
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: http://${AUTH_SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/api/auth/**

        - id: operation-service
          uri: http://${OPERATION_SERVICE_HOST:localhost}:8082
          predicates:
            - Path=/api/operation/**

        - id: reporting-service
          uri: http://${REPORTING_SERVICE_HOST:localhost}:8083
          predicates:
            - Path=/api/reporting/**
